# Hálózati figyelők
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Hitelesítés
allow_anonymous false
password_file /mosquitto/config/pwfile

# Adatmegőrzés
persistence true
persistence_file mosquitto.db
persistence_location /mosquitto/data/

# Naplózás
log_dest file /mosquitto/log/mosquitto.log
log_type all
